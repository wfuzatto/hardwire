name: Backend PHP Check

on:
  push:
    branches: [ main, 'hardwire/**' ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, openssl, json, dom
          coverage: none

      - name: Lint backend PHP
        run: |
          set -e
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify bootstrap without private credentials
        run: |
          php -r "require 'backend/bootstrap.php'; \$c=hardwire_load_config(); if ((\$c['topic'] ?? '') !== 'hardwire-events') { exit(1); } echo 'bootstrap ok'.PHP_EOL;"
